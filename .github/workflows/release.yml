# Релиз по тегу v*: бинарник overnet под каждую платформу, архивы с
# config.example.json и .sha256 рядом. Их и скачивают scripts/install.sh и
# scripts/install.ps1.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: overnet-linux-amd64.tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: overnet-linux-arm64.tar.gz }
          - { os: macos-14, target: aarch64-apple-darwin, name: overnet-macos-arm64.tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: overnet-windows-amd64.zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: overnet
    steps:
      # overnet-link-ostp берёт ostp-core по пути ../../ostp: без него cargo не
      # загрузит workspace, хотя в бинарник overnet он не входит.
      - uses: actions/checkout@v4
        with:
          path: overnet
      - uses: actions/checkout@v4
        with:
          repository: ospab/ostp
          path: ostp
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: overnet

      - name: Test
        run: cargo test -p overnet-sites -p overnet-cli --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p overnet-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/overnet config.example.json LICENSE dist/
          tar -czf ${{ matrix.name }} -C dist .
          shasum -a 256 ${{ matrix.name }} > ${{ matrix.name }}.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/overnet.exe, config.example.json, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.name }}
          "$((Get-FileHash ${{ matrix.name }} -Algorithm SHA256).Hash.ToLower())  ${{ matrix.name }}" | Out-File -Encoding ascii -NoNewline ${{ matrix.name }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: overnet/${{ matrix.name }}*

  # overnet browser: свежий Mullvad Browser (подпись проверяется) + брендинг,
  # настройки, autoconfig и overnet.exe из задачи build. См. browser/repack.py.
  browser:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: overnet-windows-amd64.zip
          path: ovzip

      - name: Download Mullvad Browser
        shell: pwsh
        run: |
          $d = Invoke-RestMethod https://cdn.mullvad.net/browser/update_responses/update_1/release/downloads.json
          $w = $d.downloads.win64.ALL
          Write-Host "Mullvad Browser $($d.version): $($w.binary)"
          Invoke-WebRequest $w.binary -OutFile mb.exe
          Invoke-WebRequest $w.sig -OutFile mb.exe.asc
          "MULLVAD_VERSION=$($d.version)" >> $env:GITHUB_ENV

      # Mullvad Browser собирает и подписывает Tor Project: ключ «Tor Browser
      # Developers» берём через WKD и сверяем отпечаток основного ключа.
      - name: Verify the signature
        shell: bash
        run: |
          gpg --batch --auto-key-locate nodefault,wkd --locate-keys torbrowser@torproject.org
          gpg --batch --status-fd 1 --verify mb.exe.asc mb.exe | tee verify.txt
          grep -E "^\[GNUPG:\] VALIDSIG .* EF6E286DDA85EA2A4BA7DE684E2C6E8793298290$" verify.txt

      - name: Unpack
        shell: pwsh
        run: |
          7z x mb.exe -omb -y | Out-Null
          $exe = Get-ChildItem mb -Recurse -Filter mullvadbrowser.exe | Select-Object -First 1
          if (-not $exe) { Get-ChildItem mb -Recurse | Select-Object -First 50 FullName; throw "mullvadbrowser.exe not found in the installer" }
          "MULLVAD_DIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
          Expand-Archive ovzip/overnet-windows-amd64.zip -DestinationPath ov
          Invoke-WebRequest https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -OutFile rcedit.exe

      - name: Repack
        run: python browser/repack.py --mullvad "${{ env.MULLVAD_DIR }}" --overnet ov/overnet.exe --out dist/overnet-browser/Browser --rcedit rcedit.exe

      - name: Smoke test
        run: python browser/smoke.py dist/overnet-browser/Browser/overnet-browser.exe shots --offline

      - name: Package
        shell: pwsh
        run: |
          $name = "overnet-browser-windows-amd64.zip"
          # В архиве — папка Browser: профиль переносной сборки ляжет рядом, в Data.
          Remove-Item dist/overnet-browser/Data -Recurse -Force -ErrorAction SilentlyContinue
          7z a -tzip -mx=7 $name ./dist/overnet-browser/Browser | Out-Null
          "$((Get-FileHash $name -Algorithm SHA256).Hash.ToLower())  $name" | Out-File -Encoding ascii -NoNewline "$name.sha256"
          Write-Host "Mullvad Browser $env:MULLVAD_VERSION -> $name ($([math]::Round((Get-Item $name).Length/1MB)) MB)"

      # Обычный установщик для людей: overnet-browser-setup.exe (Inno Setup).
      - name: Installer
        shell: pwsh
        run: |
          python browser/icons.py dist/icons
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc /Qp "/DAppVersion=$ver" "/DSourceDir=$PWD\dist\overnet-browser\Browser" "/DIconFile=$PWD\dist\icons\overnet.ico" "/O$PWD" browser\installer.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
          $name = "overnet-browser-setup.exe"
          "$((Get-FileHash $name -Algorithm SHA256).Hash.ToLower())  $name" | Out-File -Encoding ascii -NoNewline "$name.sha256"
          Write-Host "$name ($([math]::Round((Get-Item $name).Length/1MB)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: overnet-browser-windows-amd64.zip
          path: overnet-browser-windows-amd64.zip*

      - uses: actions/upload-artifact@v4
        with:
          name: overnet-browser-setup.exe
          path: overnet-browser-setup.exe*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-screenshots
          path: shots

  # Android: overnet browser на GeckoView со шлюзом overnet внутри (android/,
  # overnet-android). Один APK на процессор: arm64 и 32-битный ARM.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: overnet
    steps:
      - uses: actions/checkout@v4
        with:
          path: overnet
      - uses: actions/checkout@v4
        with:
          repository: ospab/ostp
          path: ostp
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: overnet
          key: android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"

      - name: Rust library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: >
          cargo ndk -t arm64-v8a -t armeabi-v7a --platform 26
          -o android/app/src/main/jniLibs build --release -p overnet-android

      # Ключ подписи из секретов; без них APK подписан отладочным ключом.
      - name: APK
        working-directory: overnet/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          OVERNET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/overnet.jks"
            export OVERNET_KEYSTORE="$RUNNER_TEMP/overnet.jks"
          else
            echo "::warning::no ANDROID_KEYSTORE_B64 secret: the APK is signed with a debug key"
          fi
          gradle --no-daemon assembleRelease
          cd app/build/outputs/apk/release
          for abi in arm64-v8a armeabi-v7a; do
            name=overnet-browser-android-$abi.apk
            mv app-$abi-release.apk "$GITHUB_WORKSPACE/$name"
            (cd "$GITHUB_WORKSPACE" && sha256sum "$name" > "$name.sha256" && ls -la "$name")
          done

      - uses: actions/upload-artifact@v4
        with:
          name: overnet-browser-android
          path: overnet-browser-android-*

  release:
    needs: [build, browser, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: overnet-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
