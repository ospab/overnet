// overnet browser (первая строка autoconfig всегда пропускается)
//
// Привилегированный JS, который браузер выполняет при старте:
// 1. запускает свой шлюз overnet (overnet/overnet.exe рядом с браузером) и
//    гасит его вместе с собой (у шлюза закрывается stdin);
// 2. переводит переходы на сайты не из .ov на http://browser.ov/go — там шлюз
//    решает, пустить или показать заглушку;
// 3. встраивает overnet в интерфейс: индикатор с панелью, раздел в меню и
//    знак overnet в адресной строке на сайтах .ov.
try {
  (function () {
    const IS_WIN = Services.appinfo.OS === "WINNT";

    // ── 1. Шлюз ──────────────────────────────────────────────────────────────
    let gateway = null;
    function startGateway() {
      const exe = Services.dirsvc.get("GreD", Ci.nsIFile);
      exe.append("overnet");
      exe.append(IS_WIN ? "overnet.exe" : "overnet");
      if (!exe.exists()) {
        Cu.reportError("overnet: gateway not found at " + exe.path);
        return;
      }
      const { Subprocess } = ChromeUtils.importESModule("resource://gre/modules/Subprocess.sys.mjs");
      Subprocess.call({
        command: exe.path,
        arguments: ["gateway", "--browser", "--exit-with-stdin"],
        stdin: "pipe",
        stdout: "pipe",
        stderr: "stdout",
      }).then(
        async proc => {
          gateway = proc;
          // Вывод шлюза читаем до конца, иначе труба переполнится и он встанет.
          let s;
          while ((s = await proc.stdout.readString())) {
            Services.console.logStringMessage("overnet gateway: " + s.trim());
          }
        },
        e => Cu.reportError("overnet: cannot start the gateway: " + e)
      );
    }
    Services.obs.addObserver(
      () => {
        if (gateway) {
          gateway.kill();
        }
      },
      "quit-application"
    );
    startGateway();

    // ── 2. Обычные сайты — через browser.ov/go ───────────────────────────────
    // Ответ browser.ov/go с редиректом значит «пускать»: такой переход не трогаем.
    const pass = new Set();
    const isOv = host => host === "ov" || host.endsWith(".ov");
    Services.obs.addObserver(
      subject => {
        if (!(subject instanceof Ci.nsIHttpChannel)) {
          return;
        }
        try {
          const st = subject.responseStatus;
          if (subject.URI.host === "browser.ov" && st >= 300 && st < 400) {
            pass.add(subject.getResponseHeader("Location"));
          }
        } catch (e) {}
      },
      "http-on-examine-response"
    );
    Services.obs.addObserver(
      subject => {
        if (!(subject instanceof Ci.nsIHttpChannel)) {
          return;
        }
        const ch = subject;
        const li = ch.loadInfo;
        if (!li || li.externalContentPolicyType !== Ci.nsIContentPolicy.TYPE_DOCUMENT) {
          return;
        }
        const uri = ch.URI;
        if ((uri.scheme !== "http" && uri.scheme !== "https") || isOv(uri.host.toLowerCase())) {
          return;
        }
        if (pass.delete(uri.spec)) {
          return;
        }
        ch.redirectTo(Services.io.newURI("http://browser.ov/go?url=" + encodeURIComponent(uri.spec)));
      },
      "http-on-modify-request"
    );

    // ── 3. overnet в интерфейсе браузера ─────────────────────────────────────
    // Индикатор на панели (цвет — состояние сети, по нажатию — панель со
    // статусом и кнопками), раздел в меню «три полоски» и знак overnet в
    // адресной строке на сайтах .ov вместо «Не защищено».
    const START = "http://browser.ov/";
    // Знак — кольцо в кольце; цвет — состояние сети (явный: context-fill в
    // этих местах интерфейса не работает).
    const icon = color =>
      "data:image/svg+xml," +
      encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="${color}" stroke-width="1.6">` +
          '<circle cx="8" cy="8" r="6.4"/><circle cx="8" cy="8" r="2.7"/></svg>'
      );
    const ICON = icon("#9184d9");
    const CSS = `
      #overnet-button, #appMenu-overnet-status { list-style-image: url("${icon("#9a9aa8")}"); }
      #overnet-button[overnet-state="ok"], #appMenu-overnet-status[overnet-state="ok"] { list-style-image: url("${ICON}"); }
      #overnet-button[overnet-state="connecting"], #appMenu-overnet-status[overnet-state="connecting"] { list-style-image: url("${icon("#d9b84a")}"); }
      #overnet-button[overnet-state="down"], #appMenu-overnet-status[overnet-state="down"] { list-style-image: url("${icon("#e5646d")}"); }
      #PanelUI-overnet .overnet-status { padding: 8px 16px 4px; display: flex; flex-direction: column; gap: 4px; }
      #PanelUI-overnet .overnet-status .title { font-weight: 600; font-size: 1.1em; }
      #PanelUI-overnet .overnet-status .line { color: var(--text-color-deemphasized); }
      #overnet-identity { display: none; align-items: center; gap: 4px; padding-inline: 6px 4px; color: #b5abfc; font-weight: 500; }
      #overnet-identity-icon { width: 16px; height: 16px; }
      :root[overnet-site] #overnet-identity { display: flex; }
      :root[overnet-site] #identity-box.notSecure #identity-icon,
      :root[overnet-site] #identity-box.notSecure #identity-icon-label,
      :root[overnet-site] #identity-box #identity-icon-box > #identity-icon-label,
      :root[overnet-site] #identity-box.notSecure #identity-icon-box { display: none !important; }
    `;

    // Состояние сети — у шлюза (browser.ov/status.json), раз в несколько секунд.
    let status = null; // null — шлюз не отвечает
    const isOvURI = uri => {
      try {
        return /^https?$/.test(uri.scheme) && isOv(uri.host.toLowerCase());
      } catch (e) {
        return false;
      }
    };
    function stateOf(st) {
      return !st ? "down" : st.relays > 0 ? "ok" : "connecting";
    }
    function summary(st) {
      if (!st) {
        return ["overnet is not running", "The gateway didn't answer. Restart the browser."];
      }
      if (!st.relays) {
        return ["Connecting to overnet…", "Loading the list of relays."];
      }
      return ["Connected to overnet", `${st.relays} relays in the network`];
    }
    function regularSites(st) {
      if (!st) {
        return "";
      }
      if (st.clearnet === "block") {
        return "Regular sites: blocked (only .ov opens here)";
      }
      if (st.clearnet === "exit") {
        return st.exits ? `Regular sites: through ${st.exits} exit relays` : "Regular sites: no exit relays right now";
      }
      return "Regular sites: direct, without overnet";
    }
    async function poll() {
      const win = Services.wm.getMostRecentWindow("navigator:browser");
      if (!win) {
        return;
      }
      try {
        const r = await win.fetch(START + "status.json", { cache: "no-store" });
        status = r.ok ? await r.json() : null;
      } catch (e) {
        status = null;
      }
      for (const w of Services.wm.getEnumerator("navigator:browser")) {
        paint(w.document);
      }
    }
    function paint(doc) {
      const state = stateOf(status);
      const [title] = summary(status);
      for (const id of ["overnet-button", "appMenu-overnet-status"]) {
        const node = doc.getElementById(id);
        if (node) {
          node.setAttribute("overnet-state", state);
        }
      }
      const btn = doc.getElementById("overnet-button");
      if (btn) {
        btn.setAttribute("tooltiptext", `overnet — ${title.toLowerCase()}`);
      }
      const item = doc.getElementById("appMenu-overnet-status");
      if (item) {
        item.setAttribute("label", status && status.relays ? `overnet: connected · ${status.relays} relays` : `overnet: ${title.toLowerCase()}`);
      }
    }

    async function newCircuits(win) {
      try {
        if (!status) {
          await poll();
        }
        const body = new win.URLSearchParams({ t: status ? status.token : "" });
        await win.fetch(START + "new-circuits", { method: "POST", body, redirect: "manual" });
        const nb = win.gNotificationBox;
        if (nb) {
          nb.appendNotification("overnet-new-circuits", {
            label: "New circuits: the next pages open through new relays.",
            priority: nb.PRIORITY_INFO_LOW,
          });
        }
      } catch (e) {
        Cu.reportError("overnet: new circuits: " + e);
      }
    }

    function el(doc, tag, attrs = {}) {
      const e = tag.startsWith("html:") ? doc.createElementNS("http://www.w3.org/1999/xhtml", tag.slice(5)) : doc.createXULElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "text") {
          e.textContent = v;
        } else {
          e.setAttribute(k, v);
        }
      }
      return e;
    }

    // Панель индикатора: заполняется заново при каждом открытии.
    function fillPanel(view) {
      const doc = view.ownerDocument;
      const win = doc.defaultView;
      let body = view.querySelector(".panel-subview-body");
      if (!body) {
        body = el(doc, "vbox", { class: "panel-subview-body" });
        view.appendChild(body);
      }
      body.replaceChildren();
      const [title, line] = summary(status);
      const box = el(doc, "html:div", { class: "overnet-status" });
      box.append(el(doc, "html:div", { class: "title", text: title }), el(doc, "html:div", { class: "line", text: line }));
      if (status) {
        box.append(el(doc, "html:div", { class: "line", text: regularSites(status) }));
      }
      const site = win.gBrowser && win.gBrowser.currentURI;
      if (site && isOvURI(site)) {
        box.append(el(doc, "html:div", { class: "line", text: `This tab: ${site.host}, through overnet` }));
      }
      body.append(box, el(doc, "toolbarseparator"));
      const button = (label, fn) => {
        const b = el(doc, "toolbarbutton", { class: "subviewbutton", label });
        b.addEventListener("command", () => {
          const panel = view.closest("panel");
          if (panel) {
            panel.hidePopup();
          }
          fn();
        });
        return b;
      };
      body.append(
        button("New circuits", () => newCircuits(win)),
        button("Open the overnet start page", () => win.openTrustedLinkIn(START, "tab")),
        button("Search overnet", () => win.openTrustedLinkIn("http://search.ov/", "tab"))
      );
      if (status) {
        body.append(el(doc, "toolbarseparator"), el(doc, "html:div", { class: "overnet-status line", text: `overnet ${status.version}` }));
      }
    }

    // Раздел в меню «три полоски»: строка статуса и «New circuits» сверху.
    function fillAppMenu(view) {
      const doc = view.ownerDocument;
      const win = doc.defaultView;
      if (doc.getElementById("appMenu-overnet-status")) {
        paint(doc);
        return;
      }
      const body = view.querySelector(".panel-subview-body");
      if (!body) {
        return;
      }
      const item = el(doc, "toolbarbutton", { id: "appMenu-overnet-status", class: "subviewbutton subviewbutton-iconic", label: "overnet" });
      item.addEventListener("command", () => {
        win.PanelUI.hide();
        win.openTrustedLinkIn(START, "tab");
      });
      const fresh = el(doc, "toolbarbutton", { id: "appMenu-overnet-newcircuits", class: "subviewbutton", label: "New overnet circuits" });
      fresh.addEventListener("command", () => {
        win.PanelUI.hide();
        newCircuits(win);
      });
      body.prepend(item, fresh, el(doc, "toolbarseparator"));
      paint(doc);
    }

    // Знак overnet в адресной строке для вкладок с .ov.
    function setupIdentity(win) {
      const doc = win.document;
      const box = doc.getElementById("identity-box");
      if (box && !doc.getElementById("overnet-identity")) {
        const ind = el(doc, "hbox", {
          id: "overnet-identity",
          tooltiptext: "This site is on overnet: the connection goes through the network's circuits, encrypted end to end.",
        });
        ind.append(el(doc, "image", { id: "overnet-identity-icon", src: ICON }), el(doc, "label", { value: "overnet" }));
        box.prepend(ind);
      }
      const update = () => doc.documentElement.toggleAttribute("overnet-site", isOvURI(win.gBrowser.currentURI));
      const listener = {
        onLocationChange: update,
        QueryInterface: ChromeUtils.generateQI(["nsIWebProgressListener", "nsISupportsWeakReference"]),
      };
      win.__overnetListener = listener; // слабая ссылка у gBrowser: держим сами
      win.gBrowser.addProgressListener(listener);
      win.gBrowser.tabContainer.addEventListener("TabSelect", update);
      update();
    }

    function setupWindow(win) {
      try {
        setupIdentity(win);
      } catch (e) {
        Cu.reportError("overnet: identity: " + e);
      }
      win.document.addEventListener(
        "ViewShowing",
        e => {
          try {
            if (e.target.id === "appMenu-protonMainView" || e.target.id === "appMenu-mainView") {
              fillAppMenu(e.target);
            }
          } catch (err) {
            Cu.reportError("overnet: app menu: " + err);
          }
        },
        true
      );
      paint(win.document);
    }

    Services.obs.addObserver(
      () => {
        try {
          // browser.ov — только http: HTTPS-first не должен его «улучшать».
          const p = Services.scriptSecurityManager.createContentPrincipal(Services.io.newURI("http://browser.ov"), {});
          Services.perms.addFromPrincipal(p, "https-only-load-insecure", Ci.nsIPermissionManager.ALLOW_ACTION);
        } catch (e) {
          Cu.reportError("overnet: " + e);
        }
        try {
          const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
          sss.loadAndRegisterSheet(Services.io.newURI("data:text/css," + encodeURIComponent(CSS)), sss.USER_SHEET);
          const { CustomizableUI } = ChromeUtils.importESModule("resource:///modules/CustomizableUI.sys.mjs");
          CustomizableUI.createWidget({
            id: "overnet-button",
            type: "view",
            viewId: "PanelUI-overnet",
            label: "overnet",
            tooltiptext: "overnet",
            defaultArea: CustomizableUI.AREA_NAVBAR,
            onBeforeCreated(doc) {
              if (!doc.getElementById("PanelUI-overnet")) {
                const view = el(doc, "panelview", { id: "PanelUI-overnet", class: "PanelUI-subView" });
                const cache = doc.getElementById("appMenu-viewCache");
                (cache.content || cache).appendChild(view);
              }
            },
            onViewShowing(e) {
              fillPanel(e.target);
              poll().then(() => fillPanel(e.target));
            },
          });
          // Mullvad сам раскладывает панель; кнопку ставим один раз — дальше
          // пользователь может её убрать или передвинуть.
          if (!Services.prefs.getBoolPref("overnet.button.placed", false)) {
            const pos = CustomizableUI.getPlacementOfWidget("urlbar-container");
            CustomizableUI.addWidgetToArea("overnet-button", CustomizableUI.AREA_NAVBAR, pos ? pos.position + 1 : undefined);
            Services.prefs.setBoolPref("overnet.button.placed", true);
          }
        } catch (e) {
          Cu.reportError("overnet: " + e);
        }
        try {
          const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
          AboutNewTab.newTabURL = START;
        } catch (e) {}
      },
      "final-ui-startup"
    );
    Services.obs.addObserver(win => {
      setupWindow(win);
      poll();
    }, "browser-delayed-startup-finished");
    // Опрос состояния; таймер держим сами, чтобы его не собрал GC.
    const timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
    timer.initWithCallback({ notify: () => poll() }, 5000, Ci.nsITimer.TYPE_REPEATING_SLACK);
    globalThis.__overnetTimer = timer;
  })();
} catch (e) {
  Components.utils.reportError("overnet.cfg: " + e);
}
