[package]
name = "overnet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "overnet"
path = "src/main.rs"

[dependencies]
hex = "0.4.3"
overnet-core = { path = "../overnet-core" }
overnet-link-tcp = { version = "0.0.1", path = "../overnet-link-tcp" }
overnet-node = { path = "../overnet-node" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { workspace = true, features = ["process"] }
overnet-sites = { path = "../overnet-sites" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
