<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>overnet</title>
<style>
:root{
  --bg:#0b0b10; --panel:#15151d; --panel2:#1c1c26; --line:rgba(255,255,255,.08);
  --text:#ececf1; --muted:#8a8a99; --accent:#9d6bff; --accent2:#b88bff; --ok:#34d399; --err:#f87171;
}
*{box-sizing:border-box;}
body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);}

/* Tabs */
.tabbar{display:flex;align-items:flex-end;gap:3px;background:#000;padding:6px 8px 0;overflow-x:auto;}
.tab{display:flex;align-items:center;gap:8px;max-width:220px;padding:8px 12px;background:var(--panel);
  border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap;}
.tab.active{background:var(--bg);color:var(--text);}
.tab .title{overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.tab .close{opacity:.6;border-radius:4px;padding:0 5px;line-height:1;}
.tab .close:hover{background:rgba(255,255,255,.15);opacity:1;}
#newtab{background:transparent;color:var(--muted);border:none;font-size:18px;cursor:pointer;padding:4px 12px;}
#newtab:hover{color:var(--text);}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:8px;background:var(--panel);padding:8px 12px;border-bottom:1px solid var(--line);}
.nav-btn{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.nav-btn:hover:not(:disabled){background:rgba(255,255,255,.08);}
.addr{flex:1;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:18px;color:var(--text);
  padding:8px 16px;font-family:ui-monospace,monospace;font-size:13px;outline:none;}
.addr:focus{border-color:var(--accent);}
.conn{display:flex;align-items:center;gap:6px;}
.conn input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12px;font-family:ui-monospace,monospace;}
#bootstrap-ip{width:140px;} #bootstrap-token{width:84px;}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;}
.btn:hover{background:var(--accent2);}
.pill{padding:5px 11px;border-radius:20px;font-size:12px;background:var(--panel2);color:var(--muted);}
.pill.ok{background:rgba(52,211,153,.16);color:var(--ok);}
.pill.err{background:rgba(248,113,113,.16);color:var(--err);cursor:pointer;}

/* Views */
.views{flex:1;position:relative;background:#fff;}
.views iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff;}
.panel{position:absolute;inset:0;overflow:auto;background:var(--bg);color:var(--text);display:none;}
.panel.show{display:flex;flex-direction:column;}
.hidden{display:none !important;}

/* Home */
.home-wrap{margin:auto;max-width:860px;width:100%;padding:56px 24px;}
.hero{text-align:center;margin-bottom:48px;position:relative;}
.hero::before{content:'';position:absolute;left:50%;top:20px;width:440px;height:280px;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(157,107,255,.35),transparent 65%);filter:blur(22px);z-index:-1;pointer-events:none;}
.hero h1{font-size:78px;margin:0;letter-spacing:-4px;font-weight:800;
  background:linear-gradient(135deg,#fff 35%,#cbb6ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero h1 span{background:linear-gradient(135deg,var(--accent),#6a8bff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{color:var(--muted);font-size:17px;margin:14px 0 0;}
.section-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 12px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:36px;}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--text);background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:border-color .15s,transform .15s;}
.tile:hover{border-color:var(--accent);transform:translateY(-2px);}
.tile .ico{font-size:24px;}
.tile .nm{font-weight:600;}
.tile .sub{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace;word-break:break-all;}
.empty-note{color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;}
.empty-note code{color:var(--accent);}

/* Messenger (chat app) */
.ms{display:flex;flex:1;min-height:0;}
.ms-side{width:264px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);}
.ms-side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:600;border-bottom:1px solid var(--line);}
.ms-side-head button{background:var(--accent);color:#fff;border:0;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:16px;}
.ms-side-head button:hover{background:var(--accent2);}
.ms-me{padding:10px 16px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;}
.ms-me code{color:var(--accent);font-family:ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;flex:1;}
.copy{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:11px;}
.copy:hover{color:var(--text);}
.ms-chats{flex:1;overflow:auto;}
.ms-side-empty{padding:18px 16px;color:var(--muted);font-size:13px;}
.chat-item{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent;}
.chat-item:hover{background:var(--panel2);}
.chat-item.active{background:var(--panel2);border-left-color:var(--accent);}
.chat-item .who{font-family:ui-monospace,monospace;font-size:13px;}
.chat-item .prev{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;}
.ms-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.ms-conv-head{padding:14px 22px;border-bottom:1px solid var(--line);font-family:ui-monospace,monospace;font-size:13px;color:var(--muted);}
.ms-banner{display:none;background:rgba(248,113,113,.14);color:#f8b4b4;border-bottom:1px solid var(--line);padding:10px 22px;font-size:13px;}
.ms-banner.show{display:block;}
.ms-banner code{color:var(--accent2);font-family:ui-monospace,monospace;}
.msg-list{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:8px;}
.msg-empty{margin:auto;color:var(--muted);text-align:center;}
.bubble{max-width:70%;padding:9px 13px;border-radius:14px;line-height:1.4;word-break:break-word;font-size:14px;}
.bubble.in{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px;}
.bubble.out{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.bubble .t{display:block;font-size:10px;opacity:.6;margin-top:4px;}
.compose{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:var(--panel);}
.compose textarea{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 13px;font-family:inherit;font-size:14px;outline:none;resize:none;height:42px;}
.compose textarea:focus{border-color:var(--accent);}
.send-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 20px;cursor:pointer;font-size:16px;}
.send-btn:hover{background:var(--accent2);}

/* Files (P2P) */
#files.show{display:block;overflow:auto;}
.files-wrap{margin:0 auto;max-width:760px;width:100%;padding:40px 28px;}
.files-wrap h2{margin:0 0 18px;font-size:22px;}
.files-sub{color:var(--muted);font-size:13px;font-weight:400;}
.files-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.files-me{color:var(--muted);font-size:12px;}
.files-me code{color:var(--accent);font-family:ui-monospace,monospace;}
.files-list{display:flex;flex-direction:column;gap:8px;}
.file-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;}
.file-item .fn{font-family:ui-monospace,monospace;font-size:13px;}
.file-item .lnk{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12px;}
.file-item .lnk:hover{color:var(--text);}
.files-empty{color:var(--muted);}
.files-link-in{flex:1;min-width:240px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 13px;font-family:ui-monospace,monospace;font-size:12px;outline:none;}
.files-link-in:focus{border-color:var(--accent);}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:420px;width:100%;}
.modal h3{margin-top:0;color:var(--err);}
.modal pre{background:#000;padding:12px;border-radius:8px;overflow-x:auto;color:#bbb;font-size:12px;white-space:pre-wrap;}
.modal .btn{float:right;margin-top:10px;background:var(--panel2);}
.ui-msg{color:var(--text);font-size:14px;margin:8px 0;white-space:pre-wrap;word-break:break-word;}
.ui-input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:13px;margin:8px 0;outline:none;}
.ui-input:focus{border-color:var(--accent);}
.ui-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.ui-btns .btn{float:none;margin:0;}
</style>
</head>
<body>
<div class="tabbar" id="tabbar"><button id="newtab" title="New tab">+</button></div>

<div class="toolbar">
  <button id="btn-back" class="nav-btn" disabled>&#8592;</button>
  <button id="btn-fwd" class="nav-btn" disabled>&#8594;</button>
  <button id="btn-reload" class="nav-btn">&#8635;</button>
  <button id="btn-home" class="nav-btn" title="Home">&#8962;</button>
  <input id="url-input" class="addr" placeholder="overnet://search.ov/" spellcheck="false">
  <div class="conn">
    <input id="bootstrap-ip" placeholder="bootstrap host:port">
    <input id="bootstrap-token" type="password" placeholder="token">
    <button id="connect-btn" class="btn">Connect</button>
    <span id="conn-status" class="pill">Offline</span>
  </div>
</div>

<div class="views" id="views">
  <div id="home" class="panel"></div>
  <div id="messenger" class="panel">
    <div class="ms">
      <aside class="ms-side">
        <div class="ms-side-head"><span>Chats</span><button id="ms-new" title="New chat">+</button></div>
        <div class="ms-me">you <code id="msg-myaddr">…</code><button class="copy" id="msg-copy">copy</button></div>
        <div class="ms-chats" id="ms-chats"></div>
      </aside>
      <main class="ms-main">
        <div class="ms-conv-head" id="ms-conv-head">Select or start a chat</div>
        <div id="ms-banner" class="ms-banner"></div>
        <div class="msg-list" id="msg-list"><div class="msg-empty">No chat selected.</div></div>
        <div class="compose">
          <textarea id="msg-text" placeholder="Type a message…"></textarea>
          <button class="send-btn" id="msg-send" title="Send">&#10148;</button>
        </div>
      </main>
    </div>
  </div>

  <div id="files" class="panel">
    <div class="files-wrap">
      <h2>Files <span class="files-sub">— P2P, served from your machine</span></h2>
      <div class="files-row">
        <button class="btn" id="files-add">Share a file…</button>
        <span class="files-me">your file address: <code id="files-addr">…</code></span>
      </div>
      <input type="file" id="files-input" style="display:none">
      <p class="section-label">Shared by you</p>
      <div id="files-list" class="files-list"></div>
      <p class="section-label" style="margin-top:24px">Download a file</p>
      <div class="files-row">
        <input id="files-link" class="files-link-in" placeholder="overnet://&lt;addr&gt;/&lt;file&gt;">
        <button class="btn" id="files-get">Download</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="error-modal">
  <div class="modal">
    <h3>Connection error</h3>
    <pre id="error-text"></pre>
    <button class="btn" id="modal-close">Close</button>
  </div>
</div>

<div class="modal-overlay" id="ui-modal">
  <div class="modal">
    <h3 id="ui-title">overnet</h3>
    <div id="ui-msg" class="ui-msg"></div>
    <input id="ui-input" class="ui-input" style="display:none">
    <div class="ui-btns">
      <button class="btn" id="ui-cancel" style="background:var(--panel2)">Cancel</button>
      <button class="btn" id="ui-ok">OK</button>
    </div>
  </div>
</div>

<script>
const { invoke } = window.__TAURI__.tauri;
const $ = id => document.getElementById(id);
let tabs = [], activeId = null, nextId = 1, directory = null, lastError = '';

const hostOf = u => u.replace('overnet://', '').split('/')[0];
function activeTab(){ return tabs.find(t => t.id === activeId); }

/* ---------- Home ---------- */
function renderHome(){
  const apps = `
    <p class="section-label">Apps</p>
    <div class="cards">
      <div class="tile" onclick="loadUrl('overnet://mail.ov/')">
        <div class="ico">💬</div><div class="nm">Messenger</div>
        <div class="sub">end-to-end encrypted</div>
      </div>
      <div class="tile" onclick="loadUrl('overnet://files/')">
        <div class="ico">📁</div><div class="nm">Files</div>
        <div class="sub">P2P · no central host</div>
      </div>
    </div>`;

  let services = '<div class="empty-note">Connect to a bootstrap node to see the network.</div>';
  if (directory && directory.nodes){
    const svc = directory.nodes.filter(n => n.role === 'service');
    if (svc.length){
      services = '<div class="cards">' + svc.map(n => {
        const host = n.name || n.pubkey;
        const label = n.name || (n.pubkey.slice(0,16) + '…');
        return `<div class="tile" onclick="loadUrl('overnet://${host}/')">
          <div class="ico">🌐</div><div class="nm">${label}</div>
          <div class="sub">${n.address}</div></div>`;
      }).join('') + '</div>';
    } else {
      services = '<div class="empty-note">No sites in the network yet. Publish one: '
        + '<code>overnet host ./site &lt;bootstrap&gt; news.ov</code></div>';
    }
  }

  $('home').innerHTML = `<div class="home-wrap">
    <div class="hero"><h1>over<span>net</span></h1>
      <p>The network that can't be switched off.</p></div>
    ${apps}
    <p class="section-label">Sites</p>${services}
  </div>`;
}

/* ---------- Tabs ---------- */
function createTab(url){
  const id = nextId++;
  const iframe = document.createElement('iframe');
  iframe.className = 'hidden';
  $('views').appendChild(iframe);
  tabs.push({ id, url: url || null, title: url ? '…' : 'New tab', history: [], idx: -1, iframe });
  setActive(id);
  if (url) loadUrl(url);
}
function closeTab(id){
  const i = tabs.findIndex(t => t.id === id); if (i < 0) return;
  tabs[i].iframe.remove(); tabs.splice(i, 1);
  if (tabs.length === 0){ createTab(); return; }
  if (activeId === id) setActive(tabs[Math.max(0, i - 1)].id); else renderTabs();
}
function setActive(id){
  activeId = id;
  const t = activeTab();
  tabs.forEach(x => x.iframe.classList.add('hidden'));
  const h = t && t.url ? hostOf(t.url) : null;
  $('home').classList.remove('show'); hideMessenger(); hideFiles();
  if (h === 'mail.ov'){ showMessenger(); }
  else if (h === 'files'){ showFiles(); }
  else if (t && t.url){ t.iframe.classList.remove('hidden'); }
  else { renderHome(); $('home').classList.add('show'); }
  $('url-input').value = t ? (t.url || '') : '';
  updateNav(); renderTabs();
}
function renderTabs(){
  const bar = $('tabbar');
  [...bar.querySelectorAll('.tab')].forEach(e => e.remove());
  tabs.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tab' + (t.id === activeId ? ' active' : '');
    const title = document.createElement('span'); title.className = 'title'; title.textContent = t.title;
    const close = document.createElement('span'); close.className = 'close'; close.textContent = '✕';
    close.onclick = e => { e.stopPropagation(); closeTab(t.id); };
    el.append(title, close);
    el.onclick = () => setActive(t.id);
    bar.insertBefore(el, $('newtab'));
  });
}
function updateNav(){
  const t = activeTab();
  $('btn-back').disabled = !t || t.idx <= 0;
  $('btn-fwd').disabled = !t || t.idx >= t.history.length - 1;
}

/* ---------- Navigation ---------- */
async function loadUrl(url, addHistory = true){
  let u = (url || '').trim(); if (!u) return;
  if (!u.startsWith('overnet://')) u = 'overnet://' + u;
  const t = activeTab(); if (!t) return;
  t.url = u; $('url-input').value = u;
  if (addHistory){ t.history = t.history.slice(0, t.idx + 1); t.history.push(u); t.idx++; }
  updateNav();
  $('home').classList.remove('show'); hideMessenger(); hideFiles();

  const h = hostOf(u);
  if (h === 'mail.ov'){ t.iframe.classList.add('hidden'); t.title = 'Messenger'; renderTabs(); showMessenger(); return; }
  if (h === 'files'){ t.iframe.classList.add('hidden'); t.title = 'Files'; renderTabs(); showFiles(); return; }
  t.iframe.classList.remove('hidden');
  t.iframe.srcdoc = '<body style="font-family:system-ui;color:#888;text-align:center;padding-top:60px">Routing through overnet…</body>';
  t.title = '…'; renderTabs();
  try {
    const html = await invoke('navigate', { url: u });
    t.iframe.srcdoc = html; t.title = extractTitle(html, u);
  } catch (e) {
    t.iframe.srcdoc = `<body style="font-family:system-ui;padding:28px;color:#333">
      <h2 style="color:#c0392b">Could not open page</h2><pre>${e}</pre>
      <p style="color:#888">Is the site registered, and is a relay running?</p></body>`;
    t.title = 'Error';
  }
  renderTabs();
}
function extractTitle(html, url){
  const m = html.match(/<title[^>]*>([^<]*)<\/title>/i);
  if (m && m[1].trim()) return m[1].trim();
  try { return new URL(url).host || 'overnet'; } catch (_) { return 'overnet'; }
}

/* ---------- Messenger (chats + local memory) ---------- */
let chats = {}, activeChat = null, myAddr = '', msgPoll = null;
function loadChats(){ try { chats = JSON.parse(localStorage.getItem('overnet_chats') || '{}'); } catch (_) { chats = {}; } }
function saveChats(){ localStorage.setItem('overnet_chats', JSON.stringify(chats)); }
function lastTs(a){ const m = chats[a]; return m && m.length ? m[m.length - 1].ts : 0; }
function shortAddr(a){ return a.length > 14 ? a.slice(0, 8) + '…' + a.slice(-4) : a; }
function esc(s){ return s.replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }

function mailboxBanner(){
  const b = $('ms-banner');
  if (!directory || !directory.nodes){
    b.innerHTML = '⚠ Not connected to the network. Press <b>Connect</b> (top right) first.';
    b.classList.add('show');
  } else if (!directory.nodes.some(n => n.name === 'mail.ov')){
    b.innerHTML = "⚠ Mailbox <code>mail.ov</code> is offline — messages can't be sent or received. Run <code>overnet mailbox</code> on a node.";
    b.classList.add('show');
  } else {
    b.classList.remove('show');
  }
}
async function showMessenger(){
  $('messenger').classList.add('show');
  loadChats();
  try { myAddr = await invoke('my_address'); } catch (_) { myAddr = '—'; }
  $('msg-myaddr').textContent = myAddr;
  mailboxBanner();
  renderChatList(); renderConversation();
  await refreshInbox();
  if (!msgPoll) msgPoll = setInterval(refreshInbox, 4000);
}
function hideMessenger(){ $('messenger').classList.remove('show'); if (msgPoll){ clearInterval(msgPoll); msgPoll = null; } }

function renderChatList(){
  const box = $('ms-chats');
  const addrs = Object.keys(chats).sort((a, b) => lastTs(b) - lastTs(a));
  if (!addrs.length){ box.innerHTML = '<div class="ms-side-empty">No chats yet. Press + to start one.</div>'; return; }
  box.innerHTML = addrs.map(a => {
    const m = chats[a], last = m[m.length - 1];
    const prev = last ? (last.dir === 'out' ? 'You: ' : '') + last.text : '';
    return `<div class="chat-item ${a === activeChat ? 'active' : ''}" onclick="openChat('${a}')">
      <div class="who">${shortAddr(a)}</div><div class="prev">${esc(prev)}</div></div>`;
  }).join('');
}
function openChat(addr){ activeChat = addr; $('ms-conv-head').textContent = addr; renderConversation(); renderChatList(); }
function renderConversation(){
  const list = $('msg-list');
  if (!activeChat){ list.innerHTML = '<div class="msg-empty">Select or start a chat.</div>'; return; }
  const m = chats[activeChat] || [];
  if (!m.length){ list.innerHTML = '<div class="msg-empty">No messages yet — say hi.</div>'; return; }
  list.innerHTML = m.map(x => {
    const t = new Date(x.ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return `<div class="bubble ${x.dir === 'out' ? 'out' : 'in'}">${esc(x.text)}<span class="t">${t}</span></div>`;
  }).join('');
  list.scrollTop = list.scrollHeight;
}
function pushMsg(addr, dir, text, ts){
  if (!chats[addr]) chats[addr] = [];
  chats[addr].push({ dir, text, ts: ts || Math.floor(Date.now() / 1000) });
  saveChats();
}
async function refreshInbox(){
  try {
    const msgs = await invoke('msg_fetch'); // [{from, text, ts}]
    if (!msgs.length) return;
    for (const m of msgs) pushMsg(m.from, 'in', m.text, m.ts);
    renderChatList(); if (activeChat) renderConversation();
  } catch (_) { /* not connected / mail.ov absent */ }
}
async function sendMsg(){
  const text = $('msg-text').value.trim();
  if (!text) return;
  if (!activeChat){ uiAlert('Start a chat first (press +)'); return; }
  try { await invoke('msg_send', { to: activeChat, text }); pushMsg(activeChat, 'out', text); $('msg-text').value = ''; renderConversation(); renderChatList(); }
  catch (e) { uiAlert(String(e)); }
}
async function newChat(){
  const a = (await uiPrompt('New chat', 'Recipient address (64 hex)') || '').trim();
  if (!a) return;
  if (a.length !== 64){ await uiAlert('Address must be 64 hex characters'); return; }
  if (!chats[a]){ chats[a] = []; saveChats(); }
  openChat(a);
}
$('ms-new').onclick = newChat;
$('msg-send').onclick = sendMsg;
$('msg-text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); } });
$('msg-copy').onclick = () => navigator.clipboard && navigator.clipboard.writeText(myAddr);

/* ---------- Wiring ---------- */
$('newtab').onclick = () => createTab();
$('btn-back').onclick = () => { const t = activeTab(); if (t && t.idx > 0){ t.idx--; loadUrl(t.history[t.idx], false); } };
$('btn-fwd').onclick = () => { const t = activeTab(); if (t && t.idx < t.history.length - 1){ t.idx++; loadUrl(t.history[t.idx], false); } };
$('btn-reload').onclick = () => { const t = activeTab(); if (t && t.url) loadUrl(t.url, false); else { renderHome(); $('home').classList.add('show'); } };
$('url-input').addEventListener('keydown', e => { if (e.key === 'Enter') loadUrl($('url-input').value); });

// messenger handlers are wired inside the messenger section above

$('modal-close').onclick = () => $('error-modal').style.display = 'none';
$('conn-status').onclick = () => { if ($('conn-status').classList.contains('err')){ $('error-text').textContent = lastError; $('error-modal').style.display = 'flex'; } };

/* Custom modal — replaces native prompt/alert */
let uiResolve = null;
function uiPrompt(title, placeholder){
  return new Promise(res => {
    uiResolve = res;
    $('ui-title').textContent = title;
    $('ui-msg').textContent = '';
    const inp = $('ui-input'); inp.style.display = 'block'; inp.value = ''; inp.placeholder = placeholder || '';
    $('ui-cancel').style.display = '';
    $('ui-modal').style.display = 'flex';
    setTimeout(() => inp.focus(), 50);
  });
}
function uiAlert(message){
  return new Promise(res => {
    uiResolve = () => res();
    $('ui-title').textContent = 'overnet';
    $('ui-input').style.display = 'none';
    $('ui-msg').textContent = message;
    $('ui-cancel').style.display = 'none';
    $('ui-modal').style.display = 'flex';
  });
}
function uiClose(val){ $('ui-modal').style.display = 'none'; const r = uiResolve; uiResolve = null; if (r) r(val); }
$('ui-ok').onclick = () => uiClose($('ui-input').style.display === 'none' ? undefined : $('ui-input').value.trim());
$('ui-cancel').onclick = () => uiClose(null);
$('ui-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('ui-ok').click(); else if (e.key === 'Escape') uiClose(null); });

/* Home button — exit any app/panel back to the home screen */
function goHome(){ const t = activeTab(); if (t){ t.url = null; t.title = 'Home'; } setActive(activeId); }
$('btn-home').onclick = goHome;

$('bootstrap-ip').value = localStorage.getItem('bootstrapIp') || '127.0.0.1:8080';
$('bootstrap-token').value = localStorage.getItem('bootstrapToken') || '';
$('connect-btn').onclick = async () => {
  const ip = $('bootstrap-ip').value.trim(); if (!ip) return;
  const token = $('bootstrap-token').value.trim();
  $('connect-btn').disabled = true; $('conn-status').textContent = '…'; $('conn-status').className = 'pill';
  try {
    directory = await invoke('connect_bootstrap', { addr: ip, token });
    localStorage.setItem('bootstrapIp', ip); localStorage.setItem('bootstrapToken', token);
    $('conn-status').textContent = `Connected · ${directory.nodes.length}`;
    $('conn-status').className = 'pill ok';
    if (activeTab() && !activeTab().url) renderHome();
  } catch (e) {
    lastError = String(e); $('conn-status').textContent = 'Error'; $('conn-status').className = 'pill err';
  } finally { $('connect-btn').disabled = false; }
};

/* ---------- Files (P2P) ---------- */
async function showFiles(){
  $('files').classList.add('show');
  try { $('files-addr').textContent = await invoke('my_files_address'); } catch (_) { $('files-addr').textContent = '—'; }
  await renderShared();
}
function hideFiles(){ $('files').classList.remove('show'); }
async function renderShared(){
  const box = $('files-list');
  let names = [];
  try { names = await invoke('list_files'); } catch (_) {}
  if (!names.length){ box.innerHTML = '<div class="files-empty">Nothing shared yet.</div>'; return; }
  const addr = $('files-addr').textContent;
  box.innerHTML = names.map(n =>
    `<div class="file-item"><span class="fn">${n}</span>
      <button class="lnk" onclick="copyLink('overnet://${addr}/${encodeURIComponent(n)}')">copy link</button></div>`
  ).join('');
}
function copyLink(l){ if (navigator.clipboard) navigator.clipboard.writeText(l); }
function fileToBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const s = r.result; res(s.slice(s.indexOf(',') + 1)); };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function onShareFile(ev){
  const f = ev.target.files[0]; if (!f) return;
  if (f.size > 8 * 1024 * 1024){ uiAlert('File too large (max ~8 MB for now)'); return; }
  try { const data = await fileToBase64(f); await invoke('share_file', { name: f.name, data }); await renderShared(); }
  catch (e){ uiAlert(String(e)); }
}
async function downloadLink(){
  const url = $('files-link').value.trim(); if (!url) return;
  try {
    const r = await invoke('download_url', { url });
    const bin = atob(r.data); const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([arr])); a.download = r.name; a.click();
    URL.revokeObjectURL(a.href);
  } catch (e){ uiAlert(String(e)); }
}
$('files-add').onclick = () => { $('files-input').value = ''; $('files-input').click(); };
$('files-input').addEventListener('change', onShareFile);
$('files-get').onclick = downloadLink;

createTab();
</script>
